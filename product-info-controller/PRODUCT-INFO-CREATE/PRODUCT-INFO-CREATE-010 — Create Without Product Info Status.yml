info:
  name: PRODUCT-INFO-CREATE-010 — Create Without Product Info Status
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/admin/product-info"
  body:
    type: json
    data: |-
      {
        "code": "TKT-46",
        "name": "TKT 46",
        "type": "tkt",
        "status": ""
      }
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const responseText = JSON.stringify(res.body);

        test("HTTP status is 201 Created", function () {
            expect(res.status).to.eql(201);
        });

        test("Success flag is true", function () {
            expect(res.body.success).to.eql(true);
        });

        test("Product information is created successfully", function () {
            expect(res.body.notification.exception).to.eql(false);
        });

        test("Default status is Active", function () {
            expect(res.body.data.status).to.eql("active");
        });

        test("Created product information has an ID", function () {
            expect(res.body.data.id).to.be.a("number");
        });

        test("Response status code matches HTTP status", function () {
            expect(res.body.statusCode).to.eql(res.status);
        });

        test("Response does not expose stack trace", function () {
            expect(responseText).not.to.match(
                /stackTrace|at\s+[\w.$]+\(|org\.springframework|org\.apache\.catalina/i
            );
        });

        test("Response does not expose sensitive credentials", function () {
            expect(responseText).not.to.match(
                /"(password|access_token|refresh_token|authorization)"\s*:/i
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
