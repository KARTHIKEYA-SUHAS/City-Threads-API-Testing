info:
  name: PRODUCT-INFO-LIST-003 — List Product Info by Search
  type: http
  seq: 3
  tags:
    - product-info-controller

http:
  method: GET
  url: "{{baseUrl}}/api/admin/product-info?type=tkt&search=TKT-40"
  params:
    - name: type
      value: tkt
      type: query
    - name: status
      value: ""
      type: query
      disabled: true
    - name: search
      value: TKT-40
      type: query
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const responseText = JSON.stringify(res.body);

        test("Request returns HTTP 200", function () {
            expect(res.status).to.eql(200);
        });

        test("Success flag is true", function () {
            expect(res.body.success).to.eql(true);
        });

        test("Notification indicates no exception", function () {
            expect(res.body.notification.exception).to.eql(false);
        });

        test("Product Info data is an array", function () {
            expect(res.body.data).to.be.an("array");
        });

        test("Search results contain the matching record", function () {
            expect(
                res.body.data.some(function (item) {
                    return item.code === "TKT-40";
                })
            ).to.eql(true);
        });

        test("Response status code matches HTTP status", function () {
            expect(res.body.statusCode).to.eql(res.status);
        });

        test("Response does not expose stack trace", function () {
            expect(responseText).not.to.match(
                /stackTrace|at\s+[\w.$]+\(|org\.springframework|org\.apache\.catalina/i
            );
        });

        test("Response does not expose sensitive credentials", function () {
            expect(responseText).not.to.match(
                /"(password|access_token|refresh_token|authorization)"\s*:/i
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
