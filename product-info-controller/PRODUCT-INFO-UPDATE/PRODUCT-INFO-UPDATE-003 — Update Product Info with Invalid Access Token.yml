info:
  name: PRODUCT-INFO-UPDATE-003 — Update Product Info with Invalid Access Token
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/product-info/:id"
  params:
    - name: id
      value: "{{testProductInfoId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "code": "TKT-40",
        "name": "TKT 40 Updated",
        "status": "active"
      }
  auth:
    type: bearer
    token: invalid.token.value

runtime:
  scripts:
    - type: tests
      code: |-
        const responseText = JSON.stringify(res.body);

        test("HTTP status is 401 Unauthorized", function () {
            expect(res.status).to.eql(401);
        });

        test("Success flag is false", function () {
            expect(res.body.success).to.eql(false);
        });

        test("Response does not expose product info data", function () {
            expect(res.body.data).to.be.oneOf([null, undefined]);
        });

        test("Response status code matches HTTP status when present", function () {
            if (res.body.statusCode !== undefined) {
                expect(res.body.statusCode).to.eql(res.status);
            }
        });

        test("Response does not expose stack trace", function () {
            expect(responseText).not.to.match(
                /stackTrace|at\s+[\w.$]+\(|org\.springframework|org\.apache\.catalina/i
            );
        });

        test("Response does not expose sensitive credentials", function () {
            expect(responseText).not.to.match(
                /"(password|access_token|refresh_token|authorization)"\s*:/i
            );
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
