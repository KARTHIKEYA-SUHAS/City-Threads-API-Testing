info:
  name: PRODUCT-INFO-UPDATE-009 — Update Product Info with Empty Request Body
  type: http
  seq: 9

http:
  method: PATCH
  url: "{{baseUrl}}/api/admin/product-info/:id"
  params:
    - name: id
      value: "{{testProductInfoId}}"
      type: path
  body:
    type: json
    data: "{}"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const responseText = JSON.stringify(res.body);

        test("Empty update payload is handled without server error", function () {
            expect(res.status).to.be.oneOf([200, 204, 400, 422]);
        });

        test("Server error is not returned", function () {
            expect(res.status).not.to.be.oneOf([500, 502, 503]);
        });

        test("Response does not expose stack trace", function () {
            expect(responseText).not.to.match(
                /stackTrace|at\s+[\w.$]+\(|org\.springframework|org\.apache\.catalina/i
            );
        });

        test("Response does not expose sensitive credentials", function () {
            expect(responseText).not.to.match(
                /"(password|access_token|refresh_token|authorization)"\s*:/i
            );
        });

        test("Response status code matches HTTP status when present", function () {
            if (res.body.statusCode !== undefined) {
                expect(res.body.statusCode).to.eql(res.status);
            }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
