info:
  name: USER-ROLES-006 — Validate Response Structure and Role Data
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/admin/users/roles"
  auth:
    type: bearer
    token: "{{accessToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("Response contains notification, data, statusCode and success", function () {
            expect(res.body).to.have.all.keys(
                "notification",
                "data",
                "statusCode",
                "success",
                "responseTime"
            );
        });

        test("Roles data is a non-empty array", function () {
            expect(res.body.data).to.be.an("array").that.is.not.empty;
        });

        test("Each role has the correct data types", function () {
            res.body.data.forEach(function (role) {
                expect(role.id).to.be.a("number");
                expect(role.code).to.be.a("string").that.is.not.empty;
                expect(role.name).to.be.a("string").that.is.not.empty;
                expect(role.description).to.be.a("string");
            });
        });

        test("Role IDs are unique", function () {
            const ids = res.body.data.map(role => role.id);
            expect(ids.length).to.eql(new Set(ids).size);
        });

        test("Role codes are unique", function () {
            const codes = res.body.data.map(role => role.code);
            expect(codes.length).to.eql(new Set(codes).size);
        });

        test("Administrator role is present", function () {
            expect(res.body.data.map(role => role.code)).to.include("ADMIN");
        });

        test("Executive role is present", function () {
            expect(res.body.data.map(role => role.code)).to.include("EXECUTIVE");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
